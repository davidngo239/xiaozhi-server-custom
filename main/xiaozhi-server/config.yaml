TTS:
  # Các loại hiện được hỗ trợ là edge và doubao, bạn có thể tự điều chỉnh.
  EdgeTTS:
    # Xác định các loại API TTS
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
    # ngôn ngữ: "Tiếng Trung" # Chỉ định ngôn ngữ đầu ra, chẳng hạn như: Tiếng Trung, tiếng Anh, tiếng Nhật, tiếng Hàn, v.v. Vui lòng đặt theo ngôn ngữ được hỗ trợ bởi âm đã chọn. Nếu để trống thì mặc định là tiếng Trung.
  DoubaoTTS:
    # Xác định các loại API TTS
    type: doubao
    # Đối với dịch vụ tổng hợp giọng nói của Volcano Engine, trước tiên bạn cần tạo một ứng dụng trong bảng điều khiển Volcano Engine và lấy appid và access_token.
    # Mountain Engine Voice phải được mua và trả phí. Giá khởi điểm là 30 nhân dân tệ, có thể sử dụng cho 100 lần giao dịch đồng thời. Nếu bạn sử dụng cái miễn phí chỉ có 2 concurrency thì thường sẽ báo lỗi tts.
    # Sau khi mua dịch vụ, bạn có thể phải đợi khoảng nửa giờ để sử dụng âm thanh miễn phí.
    # Âm thanh phổ biến có sẵn ở đây:https://console.volcengine.com/speech/service/8
    # Có thể kích hoạt giọng Wanwan Xiaohe tại đây: https://console.volcengine.com/speech/service/10007. Sau khi kích hoạt, đặt voice bên dưới thành zh_female_wanwanxiaohe_moon_bigtts.
    api_url: https://openspeech.bytedance.com/api/v1/tts
    voice: BV001_streaming
    output_dir: tmp/
    authorization: "Bearer;"
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    cluster: volcano_tts
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
    # ngôn ngữ: "Tiếng Trung" # Chỉ định ngôn ngữ đầu ra, chẳng hạn như: Tiếng Trung, tiếng Anh, tiếng Nhật, tiếng Hàn, v.v. Vui lòng đặt theo ngôn ngữ được hỗ trợ bởi âm đã chọn. Nếu để trống thì mặc định là tiếng Trung.
  #Tts núi lửa, hỗ trợ tts phát trực tuyến hai chiều
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    # chuyến thămhttps://console.volcengine.com/speech/service/10007 Mở một mô hình lớn tổng hợp giọng nói và mua âm thanh
    # Nhận appid và access_token ở cuối trang
    # ID tài nguyên được cố định thành: volc.service_type.10029 (tổng hợp và trộn giọng nói mô hình lớn)
    # Nếu là Gizwits, hãy thay đổi địa chỉ giao diện thành wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits không cần điền appid từ đầu
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    resource_id: volc.service_type.10029
    speaker: zh_female_wanwanxiaohe_moon_bigtts
    # Cho phép sử dụng lại kết nối WebSocket, sử dụng lại mặc định (lưu ý: khi thiết bị ở trạng thái lắng nghe sau khi sử dụng lại, các liên kết nhàn rỗi sẽ chiếm số lượng kết nối đồng thời)
    enable_ws_reuse: True
    # Tài liệu tham số liên quan:https://www.volcengine.com/docs/6561/1329505
    # Cấu hình đầu ra âm thanh (audio_params) - Người dùng có thể tùy chỉnh mọi thông số âm thanh được hỗ trợ bởi công cụ Volcano
    audio_params:
      speech_rate: 0  # 语速(-50~100)
      loudness_rate: 0  # 音量(-50~100)
      # Thông số âm sắc đa cảm xúc, lưu ý: hiện tại chỉ có một số âm sắc hỗ trợ cài đặt cảm xúc.
      # Danh sách giai điệu liên quan:https://www.volcengine.com/docs/6561/1257544
      # cảm xúc: "trung tính" # Loại cảm xúc (chỉ được hỗ trợ bởi một số âm sắc): trung tính, vui, buồn, tức giận, sợ hãi, ghê tởm, ngạc nhiên
      # cảm xúc_scale: 4 # Cường độ cảm xúc (1~5)
    # Cấu hình xử lý văn bản nâng cao (bổ sung) - Người dùng có thể tùy chỉnh bất kỳ tham số nâng cao nào được hỗ trợ bởi công cụ Volcano
    additions:
      post_process:
        pitch: 0  # 音高(-12~12)
      # aigc_metadata: {} # Cấu hình siêu dữ liệu AIGC
      # cache_config: {} # Cấu hình bộ đệm
    # Cấu hình điều khiển trộn (mix_loa) - trộn đa thời gian (chỉ TTS 1.0)
    # Chức năng trộn chủ yếu được áp dụng cho âm sắc của mô hình tổng hợp giọng nói Doubao 1.0. Khi sử dụng, bạn cần đặt req_params.loa thành custom_mix_bigtts
    # mix_speaker:
    #   speakers:
    #     - source_speaker: zh_male_bvlazysheep
    #       mix_factor: 0.3
    #     - source_speaker: BV120_streaming
    #       mix_factor: 0.3
    #     - source_speaker: zh_male_ahu_conversation_wvae_bigtts
    #       mix_factor: 0.4
    # ngôn ngữ: "Tiếng Trung" # Chỉ định ngôn ngữ đầu ra, chẳng hạn như: Tiếng Trung, tiếng Anh, tiếng Nhật, tiếng Hàn, v.v. Vui lòng đặt theo ngôn ngữ được hỗ trợ bởi âm đã chọn. Nếu để trống thì mặc định là tiếng Trung.
  #Mô hình tổng hợp giọng nói Doubao 2.0, hỗ trợ truyền phát tts hai chiều (dựa trên tài nguyên Seed-tts-2.0)
  HuoshanDoubleStreamTTSV2:
    type: huoshan_double_stream
    # chuyến thămhttps://console.volcengine.com/speech/service/10035 Mở một mô hình lớn tổng hợp giọng nói và mua âm thanh
    # Nhận appid và access_token ở cuối trang
    # ID tài nguyên được cố định thành: Seed-tts-2.0 (Mô hình tổng hợp giọng nói Doubao 2.0)
