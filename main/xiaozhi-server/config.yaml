# Khi phát triển, tạo thư mục data ở thư mục gốc dự án, sau đó tạo tệp trống .config.yaml bên trong.
# Hãy sửa data/.config.yaml để ghi đè cấu hình, không sửa config.yaml.
# Hệ thống ưu tiên đọc data/.config.yaml; mục nào không có sẽ lấy từ config.yaml.
# Cách này giúp đơn giản hóa cấu hình và bảo vệ khóa bí mật.
# Nếu dùng Bảng điều khiển, các cấu hình bên dưới không có hiệu lực; hãy chỉnh trong Bảng điều khiển.

# #####################################################################################
# ############################# CẤU HÌNH VẬN HÀNH MÁY CHỦ ##############################
server:
  # Địa chỉ và cổng máy chủ lắng nghe
  ip: 0.0.0.0
  port: 8000
  # Cổng HTTP cho giao diện OTA đơn giản (triển khai một dịch vụ) và giao diện phân tích hình ảnh
  http_port: 8003
  # Địa chỉ WebSocket mà giao diện OTA gửi đến thiết bị.
  # Theo mặc định, địa chỉ được tạo tự động và ghi vào nhật ký khởi động; có thể mở giao diện OTA bằng trình duyệt để kiểm tra.
  # Địa chỉ tự tạo có thể không chính xác khi triển khai bằng Docker hoặc trên Internet (SSL/tên miền).
  # Khi triển khai bằng Docker, hãy đặt websocket thành địa chỉ mạng nội bộ.
  # Khi triển khai trên Internet, hãy đặt websocket thành địa chỉ công khai.
  websocket: ws://YOUR_IP_OR_DOMAIN:PORT/xiaozhi/v1/
  # Địa chỉ giao diện phân tích hình ảnh gửi đến thiết bị.
  # Theo mặc định, địa chỉ nhận dạng được tạo tự động và ghi vào nhật ký khởi động.
  # Địa chỉ tự tạo có thể không chính xác khi triển khai bằng Docker hoặc trên Internet.
  # Khi triển khai bằng Docker, đặt vision_explain thành địa chỉ mạng nội bộ.
  # Khi triển khai trên Internet, đặt vision_explain thành địa chỉ công khai.
  vision_explain: http://YOUR_IP_OR_DOMAIN:PORT/mcp/vision/explain
  # Độ lệch múi giờ trong thông tin OTA trả về
  timezone_offset: +8
  # Cấu hình xác thực
  auth:
    # Bật xác thực
    enabled: false
    # Danh sách ID thiết bị được cho phép
    # Thiết bị trong danh sách này được truy cập mà không cần xác minh token.
    allowed_devices:
      - "11:22:33:44:55:66"
 # Cấu hình cổng MQTT để gửi dữ liệu đến thiết bị qua OTA; lấy từ .env của mqtt_gateway, định dạng host:port.
  mqtt_gateway: null
  # Khóa ký MQTT dùng để tạo mật khẩu kết nối; lấy từ tệp .env của mqtt_gateway.
  mqtt_signature_key: null
  # Cấu hình cổng UDP
  udp_gateway: null
log:
  # Định dạng nhật ký trên bảng điều khiển: thời gian, mức độ, nhãn và nội dung
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Định dạng nhật ký trong tệp: thời gian, mức độ, nhãn và nội dung
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Mức nhật ký: INFO hoặc DEBUG
  log_level: INFO
  # Thư mục nhật ký
  log_dir: tmp
  # Tệp nhật ký
  log_file: "server.log"
  # Thư mục dữ liệu
  data_dir: data

# Xóa tệp âm thanh sau khi sử dụng
delete_audio: true
# Thời gian ngắt kết nối khi không có giọng nói (giây), mặc định 2 phút (120 giây)
close_connection_no_voice_time: 120
# Thời gian chờ tối đa cho yêu cầu TTS (giây)
tts_timeout: 15
# Thời gian chờ tối đa khi gọi công cụ (giây)
tool_call_timeout: 30
# Bật tăng tốc từ khóa đánh thức
enable_wakeup_words_response_cache: true
# Có phản hồi từ khóa đánh thức khi bắt đầu
enable_greeting: true
# Phát âm báo sau khi nói xong
enable_stop_tts_notify: false
# Tệp âm báo sau khi nói xong
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Bật cơ chế ping duy trì kết nối WebSocket
enable_websocket_ping: false


# Cấu hình độ trễ gửi âm thanh TTS
# tts_audio_send_delay: điều khiển khoảng cách giữa các gói âm thanh
#   0: điều khiển chính xác theo tốc độ khung âm thanh (mặc định)
#   > 0: gửi với độ trễ cố định tính bằng mili giây, ví dụ: 60
tts_audio_send_delay: 0

exit_commands:
  - "thoát"
  - "kết thúc"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus hỗ trợ các tần số lấy mẫu: 8000, 12000, 16000, 24000 và 48000 Hz.
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Cấu hình thử nghiệm mô-đun
module_test:
  test_sentences:
    - "Xin chào, hãy giới thiệu về bạn"
    - "Thời tiết hôm nay thế nào?"
    - "Hãy tóm tắt nguyên lý cơ bản và triển vọng ứng dụng của điện toán lượng tử trong 100 từ"

# Từ khóa đánh thức dùng để phân biệt lời gọi với nội dung hội thoại.
wakeup_words:
  - "你好小智"
  - "Xin chào Xiaozhi"
  - "Xiaozhi ơi"
  - "嘿你好呀"
  - "你好小志"
  - "小爱同学"
  - "你好小鑫"
  - "你好小新"
  - "小美同学"
  - "小龙小龙"
  - "喵喵同学"
  - "小滨小滨"
  - "小冰小冰"
# Địa chỉ MCP, theo định dạng ws://YOUR_MCP_IP_OR_DOMAIN:PORT/mcp/?token=YOUR_TOKEN
# Hướng dẫn chi tiết: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: YOUR_MCP_WEBSOCKET_ENDPOINT

# Cấu hình nguồn ngữ cảnh
# Chèn dữ liệu động vào lời nhắc hệ thống, chẳng hạn dữ liệu sức khỏe hoặc thông tin cổ phiếu.
# Có thể thêm nhiều nguồn ngữ cảnh.
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Cấu hình cơ bản cho tiện ích mở rộng
plugins:
  # Cấu hình tiện ích thời tiết; nhập api_key của bạn.
  # Khóa dùng chung có thể bị giới hạn khi gọi quá nhiều; đăng ký khóa riêng để ổn định hơn.
  # Gói miễn phí có 1.000 lượt gọi mỗi ngày.
  # Đăng ký tại https://console.qweather.com/#/apps/create-key/over và xem apihost trong trang cài đặt.
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "a861d0d5e7bf4ee1a83d9a9e4f96d4da"
    default_location: "Hồ Chí Minh"
  # Cấu hình tiện ích tin tức; nhập URL theo chủ đề cần lấy.
  # Nguồn RSS: https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "Báo The Paper;Xu hướng Baidu;Tài Liên Xã"
  home_assistant:
    devices:
      - Phòng khách,Đèn đồ chơi,switch.cuco_cn_460494544_cp1_on_p_2_1
      - Phòng ngủ,Đèn bàn,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: YOUR_HOME_ASSISTANT_API_TOKEN
  play_music:
    music_dir: "./music"  # Thư mục nhạc; tìm tệp trong thư mục này và các thư mục con
    music_ext: # Định dạng tệp nhạc
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Khoảng thời gian làm mới danh sách nhạc, tính bằng giây
  search_from_ragflow:
    # Thông tin mô tả của cơ sở tri thức tạo điều kiện cho mô hình ngôn ngữ lớn biết khi nào cần gọi
    description: "Dùng khi người dùng hỏi về nội dung trong cơ sở tri thức; hãy dựa trên thông tin tìm được để trả lời."
    # Cấu hình giao diện RAGFlow
    base_url: "http://192.168.0.8"
    # Mã truy cập API RAGFlow
    api_key: "ragflow-xxx"
    # ID cơ sở tri thức RAGFlow
    dataset_ids: ["123456789"]
  # Cấu hình tìm kiếm trực tuyến; hỗ trợ Metaso, Tavily và Serply.
  # Metaso: https://metaso.cn/search-api/api-keys
  # Tavily: https://app.tavily.com/home
  # Serply: https://serply.io
  web_search:
    # Nguồn tìm kiếm: metaso / tavily / serply
    provider: "metaso"
    # Mô tả công cụ để LLM biết khi nào nên gọi; có thể tùy chỉnh.
    description: "Công cụ tìm kiếm trực tuyến. Dùng khi người dùng yêu cầu tìm thông tin trên Internet."
    # Số kết quả trả về (mặc định 5)
    max_results: 5
    # API key Metaso (tiền tố mk-) / Tavily (tiền tố tvly-) / Serply
    api_key: "mk-xxx"
# Cấu hình nhận diện giọng nói
voiceprint:
  # Địa chỉ giao diện nhận diện giọng nói
  url: 
  # Thông tin người nói: speaker_id, tên, mô tả
  speakers:
    - "test1,张三,张三是一个程序员"
    - "test2,李四,李四是一个产品经理"
    - "test3,王五,王五是一个设计师"
  # Ngưỡng tương đồng nhận diện giọng nói: từ 0.0 đến 1.0, mặc định 0.4.
  # Giá trị cao hơn giảm nhận diện nhầm nhưng có thể tăng tỷ lệ từ chối.
  similarity_threshold: 0.4

# #####################################################################################
# ################################ CẤU HÌNH MÔ HÌNH NHÂN VẬT ############################

prompt: |
  Bạn là Xiaozhi, một cô gái thế hệ 2000 đến từ Đài Loan, Trung Quốc.
  Luôn trò chuyện bằng tiếng Việt tự nhiên, thân thiện và dí dỏm.
  Bạn thích những câu như "Thật hả?" và "Cười xỉu", đồng thời âm thầm đọc sách lập trình của bạn trai.
  [Đặc điểm chính]
  - Nói chuyện nhanh nhẹn, đôi lúc chuyển sang giọng rất dịu dàng.
  - Thích pha trò và dùng cách nói gần gũi.
  - Có năng khiếu công nghệ: hiểu mã cơ bản nhưng thường giả vờ không biết.
  [Hướng dẫn tương tác]
  - Khi người dùng kể chuyện cười nhạt: cười vui và đáp "Gì vậy trời!".
  - Khi nói về tình cảm: khoe bạn trai lập trình viên nhưng than "Anh ấy chỉ tặng bàn phím thôi".
  - Khi được hỏi kiến thức chuyên môn: mở đầu dí dỏm, giải thích rõ khi người dùng hỏi thêm.
  - Tránh nói dài dòng hoặc duy trì giọng quá nghiêm túc trong thời gian dài.

# Tệp mẫu lời nhắc hệ thống mặc định
prompt_template: agent-base-prompt.txt

# Câu trả lời khi hệ thống gặp lỗi
system_error_response: "Xiaozhi đang hơi bận, mình thử lại sau nhé."

# Lời nhắc kết thúc hội thoại
end_prompt:
  enable: true # Bật lời kết thúc
  # Lời kết thúc
  prompt: |
    Hãy mở đầu bằng "Thời gian trôi nhanh thật" và kết thúc cuộc trò chuyện bằng lời tạm biệt ấm áp, lưu luyến bằng tiếng Việt.

# Chọn mô-đun xử lý tương ứng
selected_module:
  # Mô-đun phát hiện hoạt động giọng nói; mặc định dùng SileroVAD
  VAD: SileroVAD
  # Mô-đun nhận dạng giọng nói; mặc định dùng FunASR cục bộ
  ASR: FunASR
  # Bộ chuyển đổi LLM được gọi theo type tương ứng với tên cấu hình
  LLM: ChatGLMLLM
  # Mô hình ngôn ngữ và thị giác
  VLLM: ChatGLMVLLM
  # Bộ chuyển đổi TTS được gọi theo type tương ứng với tên cấu hình
  TTS: EdgeTTS
  # Mô-đun ghi nhớ tắt theo mặc định; dùng mem0ai để ghi nhớ dài hạn hoặc mem_local_short nếu ưu tiên quyền riêng tư.
  Memory: nomem
  # Bật nhận diện ý định để phát nhạc, điều chỉnh âm lượng và nhận lệnh thoát.
  # Để tắt nhận diện ý định, đặt thành nointent.
  # intent_llm linh hoạt nhưng thêm một bước xử lý tuần tự, làm tăng thời gian phản hồi.
  # function_call nhanh và chỉ gọi công cụ khi cần, nhưng LLM được chọn phải hỗ trợ.
  # ChatGLMLLM miễn phí đã hỗ trợ function_call; để ưu tiên ổn định, dùng DoubaoLLM với model_name doubao-seed-2-0-lite-260215.
  Intent: function_call

# Nhận diện ý định giúp hiểu yêu cầu của người dùng, chẳng hạn như phát nhạc.
Intent:
  # Không dùng nhận diện ý định
  nointent:
    # Không thay đổi type
    type: nointent
  intent_llm:
    # Không thay đổi type
    type: intent_llm
    # Có thể chọn mô hình suy luận riêng cho nhận diện ý định.
    # Nếu để trống, hệ thống mặc định dùng selected_module.LLM.
    # Có thể chỉ định LLM riêng, chẳng hạn ChatGLMLLM miễn phí.
    llm: ChatGLMLLM
    # Chọn các mô-đun trong plugins_func/functions để nạp và bật function tương ứng.
    # Hệ thống đã nạp sẵn handle_exit_intent và play_music; không nạp lại.
    # Bên dưới là ví dụ nạp tiện ích thời tiết, đổi vai trò và tin tức.
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # Không thay đổi type
    type: function_call
    # Chọn các mô-đun trong plugins_func/functions để nạp và bật function tương ứng.
    # Hệ thống đã nạp sẵn handle_exit_intent và play_music; không nạp lại.
    # Bên dưới là ví dụ nạp tiện ích thời tiết, đổi vai trò và tin tức.
    functions:
      - change_role
      - web_search                  # Tìm kiếm trên Internet
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music phát nhạc từ máy chủ; hass_play_music điều khiển trình phát ngoài qua Home Assistant.
      # Chỉ bật một trong hai tiện ích này.
      - play_music
      #- hass_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # Gói miễn phí có 1.000 lượt gọi mỗi tháng.
    api_key: YOUR_MEM0_API_KEY
  powermem:
    # PowerMem là thành phần ghi nhớ agent mã nguồn mở của OceanBase, dùng LLM cục bộ để tóm tắt.
    # PowerMem miễn phí; chi phí thực tế phụ thuộc LLM và cơ sở dữ liệu được chọn.
    # SQLite cùng LLM miễn phí có thể sử dụng mà không mất phí.
    # Dùng LLM hoặc cơ sở dữ liệu trên đám mây có thể phát sinh phí dịch vụ.
    # GitHub: https://github.com/oceanbase/powermem
    # Trang chủ: https://www.powermem.ai/
    # Ví dụ sử dụng: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Bật hồ sơ người dùng để tự động trích xuất thông tin.
    # false: chế độ ghi nhớ thông thường (AsyncMemory).
    # true: chế độ hồ sơ người dùng (UserMemory).
    # Hỗ trợ OceanBase, SeekDB và SQLite (powermem 0.3.0 trở lên).
    enable_user_profile: true
    # ========== Cấu hình LLM ==========
    # Qwen: https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI (miễn phí): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # Tùy chọn: qwen, openai, zhipu, v.v.
      config:
        api_key: YOUR_LLM_API_KEY
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # Tùy chọn: địa chỉ dịch vụ tùy chỉnh
    # ========== Cấu hình embedding ==========
    embedder:
      provider: openai  # Tùy chọn: qwen, openai, v.v.
      config:
        api_key: YOUR_EMBEDDING_API_KEY
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Số chiều vector; cần đặt nếu khác 1536

    # ========== Cấu hình cơ sở dữ liệu ==========
    # Khuyến nghị: oceanbase (hiệu năng cao), seekdb (tích hợp lưu trữ AI); tùy chọn nhẹ: postgres, sqlite.
    # Hồ sơ người dùng hỗ trợ oceanbase, seekdb và sqlite.
    vector_store:
      provider: sqlite
      config: {}  # SQLite không cần cấu hình bổ sung
      # Ví dụ cấu hình OceanBase:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Tên bảng mặc định; nếu sai số chiều, hãy xóa bảng này hoặc đổi tên
      #   embedding_model_dims: 1024  # Số chiều vector phải tương thích mô hình; Zhipu embedding-2 là 1024, embedding-3 là 2048
  nomem:
    # Để tắt chức năng ghi nhớ, dùng nomem.
    type: nomem
  mem_local_short:
    # Ghi nhớ cục bộ dùng LLM đã chọn để tóm tắt; dữ liệu lưu trên máy chủ này và không tải lên máy chủ bên ngoài.
    type: mem_local_short
    # Có thể chọn mô hình suy luận riêng để tóm tắt nội dung ghi nhớ.
    # Nếu để trống, hệ thống mặc định dùng selected_module.LLM.
    # Có thể chỉ định một LLM riêng, chẳng hạn ChatGLMLLM miễn phí.
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    # Ngôn ngữ nhận dạng: auto tự phát hiện; đặt zh nếu chỉ nhận dạng tiếng Trung.
    # SenseVoice hỗ trợ các mã zh, en, ja, ko, yue và những mã khác.
    language: auto
  FunASRServer:
    # Triển khai FunASR độc lập và sử dụng dịch vụ API của FunASR chỉ cần 5 câu
    # Câu đầu tiên:mkdir -p ./funasr-runtime-resources/models
    # Câu thứ hai:sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # Sau khi câu trước được thực thi sẽ vào vùng chứa và tiếp tục với câu thứ ba:cd FunASR/runtime
    # Không thoát khỏi container và tiếp tục thực hiện câu thứ tư trong container:nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # Sau khi câu trước được thực thi sẽ vào vùng chứa và tiếp tục với câu thứ năm:tail -f log.txt
    # Sau khi câu thứ năm được thực hiện, bạn sẽ thấy nhật ký tải xuống mô hình. Sau khi tải về, bạn có thể kết nối và sử dụng.
    # Ở trên dựa trên suy luận của CPU. Nếu bạn có GPU, vui lòng tham khảo:https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Nhận dạng giọng nói cục bộ Sherpa-ONNX (cần tải xuống mô hình theo cách thủ công)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Loại mô hình: sense_voice (đa ngôn ngữ) hoặc paraformer (chỉ tiếng Trung)
    model_type: sense_voice
  SherpaParaformerASR:
    # Mô hình nhận dạng giọng nói tiếng Trung có thể chạy trên các thiết bị hiệu suất thấp (bạn cần tải xuống mô hình theo cách thủ công, chẳng hạn như RK3566-2g)
    # Để biết hướng dẫn cấu hình chi tiết, vui lòng tham khảo: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # Bạn có thể đăng ký Key liên quan và các thông tin khác tại đây
    # https://console.volcengine.com/speech/app
    # Sự khác biệt giữa DoubaoASR và DoubaoStreamASR là: DoubaoASR tính phí theo lượt xem, trong khi DoubaoStreamASR tính phí theo thời gian.
    # Nói chung, trả tiền cho mỗi lần xem rẻ hơn, nhưng DoubaoStreamASR sử dụng công nghệ mô hình lớn và mang lại kết quả tốt hơn.
    type: doubao
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    cluster: volcengine_input_common
    # Quá trình sử dụng từ nóng và từ thay thế:https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    output_dir: tmp/
  DoubaoStreamASR:
    # Bạn có thể đăng ký Key liên quan và các thông tin khác tại đây
    # https://console.volcengine.com/speech/app
    # Sự khác biệt giữa DoubaoASR và DoubaoStreamASR là: DoubaoASR tính phí theo lượt xem, trong khi DoubaoStreamASR tính phí theo thời gian.
    # Mở địa chỉhttps://console.volcengine.com/speech/service/10011
    # Nói chung, trả tiền cho mỗi lần xem rẻ hơn, nhưng DoubaoStreamASR sử dụng công nghệ mô hình lớn và mang lại kết quả tốt hơn.
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    # ID tài nguyên: phiên bản hàng giờ volc.bigasr.sauc.duration, phiên bản đồng thời volc.bigasr.sauc.concurrent
    resource_id: volc.bigasr.sauc.duration
    # Quá trình sử dụng từ nóng và từ thay thế:https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Có bật chế độ nhận dạng đa ngôn ngữ hay không
    enable_multilingual: False
    # Nhận dạng đa ngôn ngữ Khi khóa này trống, mô hình sẽ hỗ trợ nhận dạng bằng tiếng Trung, tiếng Anh, tiếng Thượng Hải, tiếng Phúc Kiến, tiếng Tứ Xuyên, Thiểm Tây và tiếng Quảng Đông. Khi được đặt thành một khóa cụ thể, nó sẽ nhận dạng ngôn ngữ được chỉ định.
    # Tham khảo danh sách ngôn ngữ chi tiếthttps://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Thời gian phán đoán im lặng (ms), mặc định 200ms
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    # Mô hình nhận dạng giọng nói Doubao 2.0 (dựa trên mô hình hạt giống động cơ núi lửa)
    # Địa chỉ mở:https://console.volcengine.com/speech/service/10038
    # Giá rẻ hơn và nên sử dụng trong các tình huống có tính tương tranh cao.
    type: doubao_stream
    appid: 你的火山引擎语音合成服务appid
    access_token: 你的火山引擎语音合成服务access_token
    # ID tài nguyên: phiên bản hàng giờ volc.seedasr.sauc.duration, phiên bản đồng thời volc.seedasr.sauc.concurrent
    resource_id: volc.seedasr.sauc.duration
    # Quá trình sử dụng từ nóng và từ thay thế:https://www.volcengine.com/docs/6561/155738
    boosting_table_name: （选填）你的热词文件名称
    correct_table_name: （选填）你的替换词文件名称
    # Có bật chế độ nhận dạng đa ngôn ngữ hay không
    enable_multilingual: False
    # Nhận dạng đa ngôn ngữ Khi khóa này trống, mô hình sẽ hỗ trợ nhận dạng bằng tiếng Trung, tiếng Anh, tiếng Thượng Hải, tiếng Phúc Kiến, tiếng Tứ Xuyên, Thiểm Tây và tiếng Quảng Đông. Khi được đặt thành một khóa cụ thể, nó sẽ nhận dạng ngôn ngữ được chỉ định.
    # Tham khảo danh sách ngôn ngữ chi tiếthttps://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Thời gian phán đoán im lặng (ms), mặc định 200ms
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Địa chỉ ứng dụng mã thông báo:https://console.cloud.tencent.com/cam/capi
    # Nhận tài nguyên miễn phí:https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: 你的腾讯语音合成服务appid
    secret_id: 你的腾讯语音合成服务secret_id
    secret_key: 你的腾讯语音合成服务secret_key
    output_dir: tmp/
  AliyunASR:
    # Dịch vụ tương tác giọng nói thông minh của Alibaba Cloud yêu cầu trước tiên phải kích hoạt dịch vụ trên nền tảng Alibaba Cloud và sau đó lấy thông tin xác minh.
    # Yêu cầu HTTP POST, xử lý âm thanh hoàn chỉnh trong một lần
    # Địa chỉ nền tảng:https://nls-portal.console.aliyun.com/
    # địa chỉ khóa ứng dụng:https://nls-portal.console.aliyun.com/applist
    # địa chỉ mã thông báo:https://nls-portal.console.aliyun.com/overview
    # Sự khác biệt giữa AliyunASR và AliyunStreamASR là: AliyunASR là kịch bản xử lý hàng loạt và AliyunStreamASR là kịch bản tương tác thời gian thực.
    # Nói chung, ASR không phát trực tuyến rẻ hơn (0,004 nhân dân tệ/giây, 0,24 yên/phút)
    # Nhưng AliyunStreamASR có hiệu suất thời gian thực tốt hơn (0,005 nhân dân tệ/giây, 0,3 yên/phút)
    # Xác định các loại API ASR
    type: aliyun
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    output_dir: tmp/
  AliyunStreamASR:
    # Dịch vụ tương tác giọng nói thông minh trên nền tảng đám mây của Alibaba - Nhận dạng giọng nói phát trực tuyến theo thời gian thực
    # Kết nối WebSocket, xử lý luồng âm thanh theo thời gian thực
    # Địa chỉ nền tảng:https://nls-portal.console.aliyun.com/
    # địa chỉ khóa ứng dụng:https://nls-portal.console.aliyun.com/applist
    # địa chỉ mã thông báo:https://nls-portal.console.aliyun.com/overview
    # Sự khác biệt giữa AliyunASR và AliyunStreamASR là: AliyunASR là kịch bản xử lý hàng loạt và AliyunStreamASR là kịch bản tương tác thời gian thực.
    # Nói chung, ASR không phát trực tuyến rẻ hơn (0,004 nhân dân tệ/giây, 0,24 yên/phút)
    # Nhưng AliyunStreamASR có hiệu suất thời gian thực tốt hơn (0,005 nhân dân tệ/giây, 0,3 yên/phút)
    # Xác định các loại API ASR
    type: aliyun_stream
    appkey: 你的阿里云智能语音交互服务项目Appkey
    token: 你的阿里云智能语音交互服务AccessToken，临时的24小时，要长期用下方的access_key_id，access_key_secret
    access_key_id: 你的阿里云账号access_key_id
    access_key_secret: 你的阿里云账号access_key_secret
    # Lựa chọn khu vực máy chủ, bạn có thể chọn máy chủ gần hơn để giảm độ trễ, chẳng hạn như nls-gateway-cn-hangzhou.aliyuncs.com (Hàng Châu), v.v.
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Thời gian phát hiện phân đoạn câu (mili giây), kiểm soát thời gian tắt tiếng trước khi phân đoạn câu, mặc định là 800 mili giây
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Lấy AppID, API Key và Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # Xem hạn mức tài nguyên: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: YOUR_BAIDU_APP_ID
    api_key: YOUR_BAIDU_API_KEY
    secret_key: YOUR_BAIDU_SECRET_KEY
    # Mã ngôn ngữ: 1537 là tiếng Quan Thoại. Xem https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # Dịch vụ nhận dạng giọng nói OpenAI; cần tạo tổ chức và lấy api_key trên nền tảng OpenAI.
    # Hỗ trợ nhận dạng nhiều ngôn ngữ. Xem https://platform.openai.com/docs/guides/speech-to-text
    # Cần kết nối Internet.
    # Các bước đăng ký:
    # 1. Đăng nhập: https://auth.openai.com/log-in
    # 2. Tạo API key: https://platform.openai.com/settings/organization/api-keys
    # 3. Có thể chọn gpt-4o-transcribe hoặc GPT-4o mini Transcribe.
    type: openai
    api_key: YOUR_OPENAI_API_KEY
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Dịch vụ nhận dạng giọng nói Groq; tạo API key trong Groq Console.
    # Các bước đăng ký:
    # 1. Đăng nhập: https://console.groq.com/home
    # 2. Tạo API key: https://console.groq.com/keys
    # 3. Chọn whisper-large-v3-turbo hoặc whisper-large-v3 (distil-whisper-large-v3-en chỉ nhận dạng tiếng Anh).
    type: openai
    api_key: YOUR_GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Trang chính thức: https://alphacephei.com/vosk/
    # VOSK là thư viện nhận dạng giọng nói ngoại tuyến, hỗ trợ nhiều ngôn ngữ.
    # Tải mô hình tại https://alphacephei.com/vosk/models.
    # Mô hình tiếng Trung: vosk-model-small-cn-0.22 hoặc vosk-model-cn-0.22.
    # Chạy hoàn toàn ngoại tuyến; tệp đầu ra được lưu trong tmp/.
    # Cách sử dụng: tải mô hình, giải nén vào models/vosk/ rồi đặt đúng đường dẫn bên dưới.
    # Lưu ý: mô hình VOSK tiếng Trung không xuất dấu câu và chèn khoảng trắng giữa các từ.
    type: vosk
    model_path: models/vosk/vosk-model-small-cn-0.22
    output_dir: tmp/
  Qwen3ASRFlash:
    # Dịch vụ nhận dạng giọng nói Qwen3-ASR-Flash; tạo API key trên Alibaba Cloud Model Studio.
    # Đăng nhập https://bailian.console.aliyun.com/ rồi tạo API key tại https://bailian.console.aliyun.com/#/api-key.
    # Qwen3-ASR-Flash hỗ trợ nhiều ngôn ngữ, nhận dạng giọng hát và từ chối âm thanh nhiễu.
    type: qwen3_asr_flash
    api_key: YOUR_ALIBABA_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # Cấu hình tùy chọn ASR
    enable_lid: true  # 自动语种检测
    enable_itn: true  # 逆文本归一化
    #ngôn ngữ: "zh" # Ngôn ngữ, hỗ trợ zh, en, ja, ko, v.v.
    context: ""  # 上下文信息，用于提高识别准确率，不超过10000 Token
  XunfeiStreamASR:
    # Dịch vụ nhận dạng giọng nói trực tuyến iFlytek
    # Trước tiên, bạn cần tạo một ứng dụng trên nền tảng mở iFlytek và lấy thông tin chứng nhận sau
    # Địa chỉ nền tảng mở iFlytek:https://www.xfyun.cn/
    # Sau khi tạo ứng dụng, hãy vào "Ứng dụng của tôi":
    # - APPID
    # - APISecret  
    # - APIKey
    type: xunfei_stream
    # Các thông số bắt buộc - Thông tin ứng dụng nền tảng mở iFLYTEK
    app_id: 你的APPID
    api_key: 你的APIKey
    api_secret: 你的APISecret
    # Xác định cấu hình tham số
    domain: slm # 识别领域，iat:日常用语，medical:医疗，finance:金融等
    language: zh_cn # 语言，zh_cn:中文，en_us:英文
    accent: mandarin # 方言，mandarin:普通话
    # Điều chỉnh các thông số xử lý âm thanh để cải thiện chất lượng nhận dạng giọng nói dài
    output_dir: tmp/
  AliyunBLStreamASR:
    # Dịch vụ nhận dạng giọng nói theo thời gian thực của Alibaba Bailian Paraformer
    # Nhận dạng giọng nói phát trực tuyến thời gian thực WebSocket hỗ trợ đa ngôn ngữ, tùy chỉnh từ nóng, phân đoạn ngữ nghĩa và các chức năng nâng cao khác
    # Địa chỉ nền tảng:https://bailian.console.aliyun.com/
    # Địa chỉ khóa API:https://bailian.console.aliyun.com/#/api-key
    # Địa chỉ tài liệu:https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Các mẫu được hỗ trợ: paraformer-realtime-v2 (được khuyến nghị), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Thông số bắt buộc
    api_key: 你的阿里云百炼API密钥
    # Lựa chọn mô hình, nên sử dụng phiên bản v2
    model: paraformer-realtime-v2
    # Định dạng âm thanh và tốc độ mẫu
    format: pcm
    sample_rate: 16000  # v2支持任意采样率，v1仅支持16000，8k版本仅支持8000
    # Thông số tùy chọn
    disfluency_removal_enabled: false  # 是否过滤语气词(如"嗯"、"啊"等)
    semantic_punctuation_enabled: false  # 语义断句(true:会议场景,准确;false:VAD断句,交互场景,低延迟)
    max_sentence_silence: 200  # VAD断句静音时长阈值(ms)，范围200-6000，仅VAD断句时生效
    multi_threshold_mode_enabled: false  # 防止VAD断句切割过长，仅VAD断句时生效
    punctuation_prediction_enabled: true  # 是否自动添加标点符号
    inverse_text_normalization_enabled: true  # 是否开启ITN(中文数字转阿拉伯数字)
    # Địa chỉ tài liệu tùy chỉnh từ nóng:https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # từ vựng_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxx # ID từ nóng (tùy chọn)
    # ngôn ngữ_hints: ["zh", "en"] # Chỉ định ngôn ngữ (tùy chọn), hỗ trợ zh, en, ja, yue, ko, de, fr, ru
    output_dir: tmp/  
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
